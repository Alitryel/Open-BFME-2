name: Retail link census

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: retail-link-census-dedicated
  cancel-in-progress: false

jobs:
  census:
    if: github.repository == 'Open-BFME/Open-BFME-2' && github.ref == 'refs/heads/master'
    runs-on: bfme2-census
    timeout-minutes: 360
    steps:
      - name: Verify, measure, and publish from the dedicated checkout
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bfme-census-bootstrap"
          bash /home/levy/bfme-census-runner-state/actions/run-census.sh 2>&1 | tee "$RUNNER_TEMP/bfme-census-bootstrap/bootstrap.log"
      - name: Preserve runner bootstrap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-census-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/bfme-census-bootstrap/bootstrap.log
      - name: Preserve census logs
        if: always() && env.BFME_CENSUS_RUN_LOG != ''
        uses: actions/upload-artifact@v4
        with:
          name: link-census-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.BFME_CENSUS_RUN_LOG }}/*.log
            ${{ env.BFME_CENSUS_RUN_LOG }}/*.log.exit
            ${{ env.BFME_CENSUS_RUN_LOG }}/snapshot.txt
            ${{ env.BFME_CENSUS_RUN_LOG }}/failure-report.txt
            ${{ env.BFME_CENSUS_RUN_LOG }}/measured-link_status.csv
            ${{ env.BFME_CENSUS_RUN_LOG }}/measured-link_census_history.csv
