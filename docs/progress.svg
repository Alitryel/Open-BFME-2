    <text x="28" y="64" class="strong" font-size="15" font-weight="600">Rebuilt from source<tspan class="up" dx="10" font-size="13" font-weight="600">▲ 0.25</tspan></text>
    <text x="852" y="64" class="strong" font-size="20" font-weight="700" text-anchor="end">99.47%</text>
    <rect class="track" x="28" y="74" width="824" height="14" rx="7"/>
    <rect x="28" y="74" width="819.63" height="14" rx="7" fill="#2ea043"/>
