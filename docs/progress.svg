<svg xmlns="http://www.w3.org/2000/svg" width="880" height="406" viewBox="0 0 880 406" role="img" aria-labelledby="title desc">
  <title id="title">BFME 2: 100.00% rebuilt from source, 100.00% game code in C++*, 92.98% linking</title>
