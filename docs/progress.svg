<svg xmlns="http://www.w3.org/2000/svg" width="880" height="388" viewBox="0 0 880 388" role="img" aria-labelledby="title desc">
  <title id="title">BFME 2: 88.40% rebuilt from source, 84.75% game code in C++, 47.50% linking</title>
  <desc id="desc">7,052,837 of 7,978,500 code bytes rebuild to the original's exact bytes; 6,367,218 of the game's own 7,512,955 bytes are C++.</desc>
