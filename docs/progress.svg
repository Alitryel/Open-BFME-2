    <text x="28" y="256" class="muted" font-size="12.5">4,731,946 / 7,514,042 bytes of the game's own code linked (measured 2026-10-17, retail-truth-2 rules); census rules changed to retail-truth-2 (62.16% under retail-truth-1), not a change in progress</text>
