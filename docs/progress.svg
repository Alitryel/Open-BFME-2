<svg xmlns="http://www.w3.org/2000/svg" width="880" height="388" viewBox="0 0 880 388" role="img" aria-labelledby="title desc">
  <title id="title">BFME 2: 93.19% rebuilt from source, 89.38% game code in C++, 62.97% linking</title>
  <desc id="desc">7,435,109 of 7,978,500 code bytes rebuild to the original's exact bytes; 6,715,712 of the game's own 7,514,042 bytes are C++.</desc>
  <style>
    .card { fill: #0d1117; stroke: #30363d; } .track { fill: #21262d; }
