    <text x="28" y="138" class="strong" font-size="15" font-weight="600">Game code in C++<tspan class="up" dx="10" font-size="13" font-weight="600">▲ 0.26</tspan></text>
    <text x="852" y="138" class="strong" font-size="20" font-weight="700" text-anchor="end">95.88%</text>
    <rect class="track" x="28" y="148" width="824" height="14" rx="7"/>
    <rect x="28" y="148" width="790.07" height="14" rx="7" fill="#388bfd"/>
    <text x="28" y="182" class="muted" font-size="12.5">7,208,671 / 7,518,214 bytes of the game's own code, now C++ (libraries not counted)</text>
    <text x="28" y="212" class="strong" font-size="15" font-weight="600">Linking<tspan class="muted" dx="10" font-size="13" font-weight="600">rules changed</tspan></text>
    <text x="852" y="212" class="strong" font-size="20" font-weight="700" text-anchor="end">83.66%</text>
    <rect class="track" x="28" y="222" width="824" height="14" rx="7"/>
    <rect x="28" y="222" width="689.36" height="14" rx="7" fill="#d29922"/>
    <text x="28" y="256" class="muted" font-size="12.5">6,289,754 / 7,518,214 bytes of the game's own code linked (measured 2026-10-22, retail-truth-4 rules); census rules changed to retail-truth-4 (80.24% under retail-truth-2), not a change in progress</text>
    <text x="28" y="286" class="strong" font-size="15" font-weight="600">Readable names<tspan class="up" dx="10" font-size="13" font-weight="600">▲ 0.17</tspan></text>
    <text x="852" y="286" class="strong" font-size="20" font-weight="700" text-anchor="end">68.10%</text>
