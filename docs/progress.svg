    <rect x="28" y="296" width="561.14" height="14" rx="7" fill="#a371f7"/>
    <text x="28" y="330" class="muted" font-size="12.5">380,342 / 558,506 declared names (files, types, functions, members, globals, parameters, locals) that are not placeholders</text>
